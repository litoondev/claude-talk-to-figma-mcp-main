<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Talk to Figma — Webflow Bridge</title>
    <style>
      :root {
        --bg: #1e1e1e;
        --panel: #2b2b2b;
        --border: #3d3d3d;
        --text: #e8e8e8;
        --muted: #9a9a9a;
        --accent: #4353ff;
        --ok: #2fb344;
        --err: #e5484d;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --panel: #f6f6f6;
          --border: #e0e0e0;
          --text: #1a1a1a;
          --muted: #6b6b6b;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 10px;
      }
      h1 {
        font-size: 13px;
        font-weight: 600;
        margin: 0;
        letter-spacing: -0.01em;
      }
      .row { display: flex; gap: 6px; align-items: center; }
      label {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 3px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      input {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        color: var(--text);
        padding: 7px 8px;
        font-family: var(--mono);
        font-size: 12px;
      }
      input:focus { outline: none; border-color: var(--accent); }
      button {
        background: var(--accent);
        color: #fff;
        border: 0;
        border-radius: 5px;
        padding: 8px 14px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
      }
      button:hover { filter: brightness(1.1); }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .dot-on { background: var(--ok); }
      .dot-off { background: var(--err); }
      #log {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 8px;
        font-family: var(--mono);
        font-size: 11px;
        line-height: 1.6;
      }
      .log-line { white-space: pre-wrap; word-break: break-word; }
      .log-ok { color: var(--ok); }
      .log-error { color: var(--err); }
      .hint { color: var(--muted); font-size: 11px; }
    </style>
  </head>
  <body>
    <h1>Talk to Figma — Webflow Bridge</h1>

    <div>
      <label for="channel">Channel ID from Claude</label>
      <div class="row">
        <input id="channel" placeholder="e.g. 4f2a9c" autocomplete="off" spellcheck="false" />
        <button id="connect">Connect</button>
      </div>
    </div>

    <div>
      <label for="relay">Relay</label>
      <input id="relay" autocomplete="off" spellcheck="false" />
      <p class="hint">The bridge server started with <code>npm run socket</code>.</p>
    </div>

    <div class="status"><span id="dot" class="dot dot-off"></span><span id="status">Not connected</span></div>

    <div id="log"></div>

    <script src="app.js"></script>
  </body>
</html>
